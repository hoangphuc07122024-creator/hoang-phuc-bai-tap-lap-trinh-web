<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ayra Studio — Son dưỡng Clarins</title>
<!--
  Ayra Studio — landing page 3D cuộn cho son dưỡng Clarins (dựng từ skill 3d-scroll-product-site).
  Nội dung nằm ở BRAND + CHAPTERS trong script.
  Kiến trúc: 1 canvas Three.js cố định + các <section> DOM cao nhiều vh làm "đường ray" cuộn.
  GSAP ScrollTrigger scrub một timeline duy nhất -> ghi vào object `S` (state);
  vòng render đọc `S` mỗi frame. Không có logic nào nằm trong scroll handler.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#24161a; --paper:#f6f0ea; --muted:#8c7d7a;
    --accent:#7a1f35;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  body{overflow-x:clip} /* KHÔNG dùng overflow-x:hidden trên html/body: nó làm hỏng position:sticky */
  body{transition:background-color .2s linear}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}

  /* --- chrome --- */
  nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
      padding:18px 24px;font-size:12px;letter-spacing:.02em}
  nav .logo{font-weight:800;font-size:15px;letter-spacing:-.01em}
  nav .logo span{font-weight:400;color:var(--muted)}
  nav ul{display:flex;gap:20px;list-style:none;text-transform:uppercase;color:var(--muted)}
  nav .bag{width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px}

  /* --- scroll rails --- */
  section{position:relative;z-index:2;pointer-events:none}
  section .pin{position:sticky;top:0;height:100vh;padding:80px 24px 32px;display:flex;flex-direction:column;justify-content:center}
  #intro{height:180vh} #hero{height:220vh} .chapter{height:260vh} #bag{height:260vh}

  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tagline{position:absolute;top:90px;left:24px;max-width:220px;font-weight:500;font-size:clamp(14px,1.4vw,18px);line-height:1.15}
  .hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* chapter copy */
  .copy{max-width:560px;pointer-events:auto}
  .copy h2{font-weight:900;font-size:clamp(48px,7.6vw,124px);letter-spacing:-.05em;line-height:1.08;margin:8px 0 14px} /* 1.08: dấu dưới (ọ) không dính dấu trên dòng sau (ú) */
  .copy p{font-size:14px;line-height:1.4;max-width:280px;color:var(--muted)}
  .chips{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
  .chips span{font-size:11px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.7)}
  .cta{display:inline-flex;align-items:center;gap:10px;user-select:none;background:var(--ink);color:#fff;border:0;border-radius:99px;
       padding:10px 10px 10px 18px;font:500 13px Inter,sans-serif;cursor:pointer}
  .cta b{background:#fff;color:var(--ink);border-radius:99px;padding:3px 8px;font-size:11px}
  .chapter.right .pin{align-items:flex-end;text-align:right}
  .chapter.right .chips{justify-content:flex-end}

  /* social-proof card (nội dung mẫu — thay bằng nội dung thật của khách) */
  .card{position:absolute;right:8vw;top:50%;width:min(260px,60vw);transform:translateY(-50%) rotate(2deg);transition:none;
        background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-radius:14px;padding:10px;font-size:11px;
        box-shadow:0 30px 60px -20px rgba(0,0,0,.35);opacity:0}
  .chapter.right .card{right:auto;left:8vw;transform:translateY(-50%) rotate(-2deg)}
  .card .ph{display:block;width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:8px;margin:8px 0;background:#fff}
  .card .u{display:flex;gap:6px;align-items:center;font-weight:500}
  .card .u i{width:18px;height:18px;border-radius:50%;background:var(--c)}

  /* full-screen color wipe between chapters */
  #wipe{position:fixed;inset:0;z-index:5;pointer-events:none;clip-path:inset(100% 0 0 0)}

  /* bag scene */
  #bag .copy h2{font-size:clamp(44px,7vw,96px)}
  .receipt{position:absolute;left:24px;top:56px;width:200px;background:#fff;color:#222;font:11px/1.5 ui-monospace,monospace;
           padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);transform:translateY(-140%);
           clip-path:polygon(0 0,100% 0,100% 100%,90% 97%,80% 100%,70% 97%,60% 100%,50% 97%,40% 100%,30% 97%,20% 100%,10% 97%,0 100%)}
  .receipt .big{font-size:26px;font-weight:800;text-align:center}
  .receipt .bar{height:28px;margin:8px 0;background:repeating-linear-gradient(90deg,#222 0 2px,#fff 2px 4px,#222 4px 5px,#fff 5px 8px)}

  .legal{position:absolute;left:24px;right:24px;bottom:20px;font-size:10px;color:var(--muted);text-align:center}
  @media (max-width:640px){ nav ul{display:none} .card{display:none}
    .chapter .pin,#bag .pin{justify-content:flex-end;padding-bottom:72px} .chapter.right .pin{align-items:flex-start;text-align:left}
    .chapter.right .chips{justify-content:flex-start} #bag .copy{margin-left:0!important} .receipt{left:16px;width:120px} }
  @media (prefers-reduced-motion:reduce){ #wipe{display:none} }
  /* ===== chế độ sửa ===== */
  #ed-toggle{position:fixed;right:20px;bottom:20px;z-index:30;border:0;border-radius:99px;padding:10px 16px;
    background:var(--ink);color:#fff;font:500 13px Inter,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  #ed-panel{position:fixed;top:0;right:0;bottom:0;width:min(320px,92vw);z-index:25;background:#fffdfb;color:var(--ink);
    border-left:1px solid #eadfd9;box-shadow:-20px 0 40px rgba(0,0,0,.08);font:13px/1.4 Inter,sans-serif;
    display:flex;flex-direction:column;overflow:auto;transform:translateX(105%);transition:transform .25s ease}
  body.editing #ed-panel{transform:none}
  body.editing{padding-right:0}
  #ed-panel header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 4px}
  #ed-panel header button{border:0;background:none;font-size:16px;cursor:pointer;color:var(--muted)}
  .ed-tip{padding:0 16px 8px;color:var(--muted);font-size:12px}
  #ed-panel details{border-top:1px solid #f0e7e2;padding:8px 16px}
  #ed-panel summary{cursor:pointer;font-weight:600;padding:4px 0}
  .ed-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
  .ed-row.ed-col{flex-direction:column;align-items:stretch;gap:4px}
  .ed-row span{color:#5b4f4b;font-size:12px}
  .ed-row input[type=text]{border:1px solid #e3d8d2;border-radius:8px;padding:7px 9px;font:inherit;background:#fff}
  .ed-row input[type=color]{width:44px;height:28px;border:1px solid #e3d8d2;border-radius:6px;padding:0;background:none;cursor:pointer}
  .ed-row input[type=file]{font-size:11px}
  .ed-link{border:0;background:none;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;padding:4px 0}
  #ed-panel footer{margin-top:auto;padding:12px 16px 72px;border-top:1px solid #f0e7e2;display:grid;gap:8px}
  #ed-panel footer button{border:1px solid #e3d8d2;background:#fff;border-radius:99px;padding:9px;font:500 13px Inter,sans-serif;cursor:pointer}
  #ed-panel footer .ed-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  #ed-panel footer .ed-danger{color:#a3122c}
  .ed-status{font-size:12px;color:var(--muted);min-height:1.4em}
  body.editing section [data-k],body.editing nav [data-k]{pointer-events:auto;outline:1px dashed rgba(122,31,53,.45);outline-offset:3px;border-radius:2px;cursor:text}
  body.editing [data-k]:focus{outline:2px solid var(--accent);background:rgba(255,255,255,.55)}
  body.editing .cta{pointer-events:auto}
  @media (max-width:640px){
    #ed-panel{top:auto;height:45vh;width:100vw;transform:translateY(105%);border-left:0;border-top:1px solid #eadfd9}
    /* đang sửa trên điện thoại: đẩy chữ lên nửa trên để không bị bảng che */
    body.editing .chapter .pin,body.editing #bag .pin{justify-content:flex-start;padding-top:72px}
    body.editing #ed-toggle{bottom:calc(45vh + 12px)} }

</style>
</head>
<body>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ======================= 1. CONTENT ======================= */
// Nội dung nằm trong <script id="content">. Nếu người dùng đã bấm "Lưu" ở chế độ Sửa, bản lưu
// trong localStorage được dùng thay thế. Tên 'Nâu sô‑cô‑la' dùng U+2011 (gạch nối không ngắt dòng).
// Tên tông là mô tả màu theo ảnh, KHÔNG phải mã màu chính hãng.
// particle: berry = mâm xôi · cherry = anh đào bóng · shard = mảnh sô-cô-la
const PAGE_SOURCE = '<!doctype html>\n' + document.documentElement.outerHTML;   // chụp trước khi JS sửa DOM
const DEFAULT_CONTENT = JSON.parse(document.getElementById('content').textContent);
const STORE_KEY = 'ayra-content-v1';
let saved = null;
try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch {}
const CONTENT = saved && saved.chapters?.length === DEFAULT_CONTENT.chapters.length ? saved : structuredClone(DEFAULT_CONTENT);
const BRAND = CONTENT.brand, CHAPTERS = CONTENT.chapters;

/* ======================= 2. DOM build ======================= */
const esc = v => String(v).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const getPath = k => k.split('.').reduce((o, p) => o?.[p], CONTENT);
const setPath = (k, v) => { const ps = k.split('.'), last = ps.pop(); ps.reduce((o, p) => o[p], CONTENT)[last] = v; };
// điền mọi phần tử có data-k / data-list / data-price từ CONTENT
function fillText(root = document){
  root.querySelectorAll('[data-k]').forEach(el => {
    const v = getPath(el.dataset.k) ?? '';
    if (el.hasAttribute('data-multi')) el.innerHTML = esc(v).replace(/\n/g, '<br>'); else el.textContent = v;
  });
  root.querySelectorAll('[data-list]').forEach(el => {
    const k = el.dataset.list;
    el.innerHTML = getPath(k).map((x, j) => `<div data-k="${k}.${j}">${esc(x)}</div>`).join('');
  });
  fillDerived();
}
// những chỗ suy ra từ nội dung khác (giá, tên tông trên thẻ ảnh, menu)
function fillDerived(){
  document.querySelectorAll('[data-price]').forEach(el => el.textContent = BRAND.price);
  document.querySelector('[data-nav]').innerHTML = CHAPTERS.map(c => `<li>${esc(c.title)}</li>`).join('');
  CHAPTERS.forEach((c, i) => {
    const card = document.querySelector(`#ch-${c.id} .card`);
    card.style.setProperty('--c', c.tube);
    card.querySelector('.cap').textContent = `${c.title} · ${BRAND.price}`;
    card.querySelector('.handle').textContent = BRAND.handle;
    const img = card.querySelector('img'); if (img.getAttribute('src') !== c.img) img.src = c.img;
    img.alt = `Son dưỡng Clarins tông ${c.title}`;
  });
}
document.getElementById('chapters').innerHTML = CHAPTERS.map((c, i) => `
  <section class="chapter ${c.side==='right'?'right':''}" id="ch-${c.id}"><div class="pin">
    <div class="copy">
      <div class="eyebrow" data-k="chapters.${i}.eyebrow"></div><h2 data-k="chapters.${i}.title"></h2><p data-k="chapters.${i}.text"></p>
      <div class="chips" data-chips="${i}">${c.chips.map((_, j) => `<span data-k="chapters.${i}.chips.${j}"></span>`).join('')}</div>
      <div class="cta" role="button" tabindex="0"><span data-k="brand.ctaAdd"></span> <b data-price></b></div>
    </div>
    <div class="card">
      <div class="u"><i></i><span class="handle"></span></div><img class="ph" src="${esc(c.img)}" alt="" loading="lazy">
      <div class="cap"></div>
    </div>
  </div></section>`).join('');
fillText();

/* ======================= 3. THREE scene ======================= */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
// env map để nắp kim loại + vỏ trong suốt có phản chiếu
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 14);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8bc, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe8dc, 1.2); rim.position.set(-6, 2, -4); scene.add(rim);

// --- lõi dầu: gradient dọc + bóng mờ của đầu cọ bên trong (giả hiệu ứng nhìn xuyên kính)
function oilTexture(color){
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const g = c.getContext('2d'), base = new THREE.Color(color);
  const css = k => '#' + base.clone().multiplyScalar(k).getHexString();
  const gr = g.createLinearGradient(0,0,512,0);   // sáng giữa, tối mép => khối trụ
  gr.addColorStop(0, css(.55)); gr.addColorStop(.42, css(1.15)); gr.addColorStop(.6, css(1)); gr.addColorStop(1, css(.5));
  g.fillStyle = gr; g.fillRect(0,0,512,512);
  // thân cọ + đầu cọ cong (doe-foot), đặt ở 1/4 chu vi mặt trước
  g.fillStyle = css(.72); g.globalAlpha = .55;
  g.fillRect(100,0,56,300);
  g.beginPath(); g.ellipse(120,380,52,110,.25,0,Math.PI*2); g.fill();
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// --- son dưỡng dạng dầu, tỉ lệ theo ảnh thật: nắp vàng 33% · đai vàng 14% · thân màu 45% · đế kính 8%
const R = .42, H = 3.0;
// Vàng champagne: dùng matcap tự vẽ thay vì metalness (kim loại PBR bị tối/olive khi env tối).
// Matcap = ánh sáng "nướng sẵn" theo hướng nhìn => dải sáng dọc luôn đúng như ảnh chụp sản phẩm.
const goldMatcap = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,256,0);
  [[0,'#6f5a33'],[.12,'#a88f5c'],[.3,'#f6ecd0'],[.38,'#fffaf0'],[.5,'#e2cf9f'],[.7,'#bfa56f'],[.86,'#8c7547'],[1,'#d8c49a']]
    .forEach(([o,col]) => gr.addColorStop(o,col));
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const GOLD = () => new THREE.MeshMatcapMaterial({ matcap:goldMatcap });
function makeTube(color){
  const g = new THREE.Group();
  const y0 = -H/2;
  const seg = (h, y, mat, r=R, open=false) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 72, 1, open), mat);
    m.position.y = y + h/2; g.add(m); return m;
  };
  const hBase = .24, hBody = 1.35, hBand = .42, hCap = H - hBase - hBody - hBand;
  // đế kính dày trong suốt
  seg(hBase, y0, new THREE.MeshPhysicalMaterial({ color:0xf2f2f2, transparent:true, opacity:.55, roughness:.02, clearcoat:1, envMapIntensity:2 }));
  // lõi dầu màu + vỏ kính bóng bên ngoài
  const core = g.userData.core = seg(hBody, y0+hBase, new THREE.MeshPhysicalMaterial({ map:oilTexture(color), roughness:.25 }), R*.96);
  core.rotation.y = -Math.PI/2;
  seg(hBody, y0+hBase, new THREE.MeshPhysicalMaterial({ color:0xffffff, transparent:true, opacity:.08, roughness:.02,
    clearcoat:1, envMapIntensity:2.4, depthWrite:false }), R, true);
  // đai vàng + rãnh tối + nắp vàng
  seg(hBand, y0+hBase+hBody, GOLD());
  seg(.025, y0+hBase+hBody+hBand, new THREE.MeshStandardMaterial({ color:0x3a2c1a, roughness:.6 }), R*1.002);
  const cap = seg(hCap - .025, y0+hBase+hBody+hBand+.025, GOLD());
  // mặt trên nắp hơi lõm sáng
  const top = new THREE.Mesh(new THREE.CircleGeometry(R*.96, 72), GOLD());
  top.rotation.x = -Math.PI/2; top.position.y = H/2 + .001; g.add(top);
  return g;
}
// --- wordmark khổng lồ làm plane trong scene => vật thể có thể nằm TRƯỚC và SAU chữ
function wordmarkTexture(text, color){
  const c = document.createElement('canvas'); c.width = 2048; c.height = 640;
  const g = c.getContext('2d'); g.fillStyle = color;
  // tự thu nhỏ cỡ chữ nếu tên dài để không tràn
  let size = 560; g.font = `900 ${size}px Inter, sans-serif`;
  while (g.measureText(text).width > 1960 && size > 120) { size -= 20; g.font = `900 ${size}px Inter, sans-serif`; }
  g.textAlign='center'; g.textBaseline='middle'; g.fillText(text, 1024, 340);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function makeWordmark(text, color){
  return new THREE.Mesh(new THREE.PlaneGeometry(12, 3.75),
    new THREE.MeshBasicMaterial({ map:wordmarkTexture(text, color), transparent:true, depthWrite:false }));
}
// --- particle field theo chương (InstancedMesh: 1 draw call)
function makeParticles(kind, color, n=26){
  // shard = mảnh sô-cô-la · berry = mâm xôi (icosa flat) · cherry = quả cầu bóng
  const geo = kind==='shard'  ? new THREE.TetrahedronGeometry(.32).scale(1.4,.5,1)
            : kind==='cherry' ? new THREE.SphereGeometry(.45, 32, 32)
            :                   new THREE.IcosahedronGeometry(.42, 1);
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: kind==='cherry'?.15:.45, clearcoat: kind==='cherry'?1:.3, flatShading: kind==='berry' });
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.userData.seeds = Array.from({length:n}, (_,i)=>({
    x:(Math.random()-.5)*14, y:(Math.random()-.5)*9, z:-4+Math.random()*7,
    r:Math.random()*Math.PI*2, s:.5+Math.random()*1.1, sp:.3+Math.random()*.9
  }));
  mesh.visible = false;
  return mesh;
}
// --- shopping bag
function makeBag(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:BRAND.bag, roughness:.85 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(3,3.4,1.2), mat);
  const h = new THREE.Mesh(new THREE.TorusGeometry(.7,.04,12,48,Math.PI), new THREE.MeshStandardMaterial({ color:0xd9c3a5 }));
  h.position.y = 1.7;
  const wm = makeWordmark(BRAND.name, BRAND.bagText); wm.scale.setScalar(.22); wm.position.set(0,-.3,.61);
  g.add(box, h, wm); g.userData = { box, wm };
  return g;
}

const wordmark = makeWordmark(BRAND.name, BRAND.wordmarkColor); scene.add(wordmark);
const tubes = CHAPTERS.map(c => { const t = makeTube(c.tube); scene.add(t); return t; });
const fields = CHAPTERS.map(c => { const f = makeParticles(c.particle, c.pColor); scene.add(f); return f; });
const bag = makeBag(); scene.add(bag);
const string = new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,10), new THREE.MeshBasicMaterial({ color:0xb9aea6, transparent:true }));
scene.add(string);

/* ======================= 4. STATE — timeline ghi vào đây ======================= */
// Mỗi tuýp: x,y,z,rx,ry,rz,s. Toàn cục: wordmark opacity/scale, chương đang active, bag.
const S = {
  tubes: tubes.map(()=>({ x:0, y:12, z:0, rx:0, ry:0, rz:0, s:1 })),
  word:{ o:0, s:.85, y:0 }, field:CHAPTERS.map(()=>0), bag:{ y:-12, ry:0 }, swing:1, cam:{ z:14 }
};
// intro: tuýp 0 treo bằng dây ở giữa
Object.assign(S.tubes[0], { y:.4, s:.9 });

/* ======================= 5. SCROLL CHOREOGRAPHY ======================= */
gsap.registerPlugin(ScrollTrigger);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrub = reduce ? true : 1;   // 1s làm mượt scrub — đây là "cảm giác" cao cấp
const wipe = document.getElementById('wipe');
const HERO_SCALE = 1.15;                       // cỡ chai hero trong mỗi chương
const BAG_DROP = [ {x:2.35, y:1.55, rz:.2, s:.8}, {x:3.2, y:1.8, rz:-.05, s:.8}, {x:4.05, y:1.45, rz:-.2, s:.8} ];                          // vị trí 3 chai khi nằm trong túi
const BAG_BG = '#f4ece8';

// MỘT master timeline cho mọi thứ dùng chung state S.
// Nếu nhiều timeline cùng tween một thuộc tính, .to() ghi nhận giá trị bắt đầu ở lần render đầu,
// nên khi nhảy thẳng vào giữa trang (reload, bấm menu, "cuộn tới chương") vật thể bị kẹt sai chỗ.
// Một timeline duy nhất được GSAP render tuần tự => vị trí luôn đúng dù nhảy tới đâu.
const master = gsap.timeline({ defaults:{ ease:'none' } });
const M = document.documentElement.scrollHeight - innerHeight;   // các section cao theo vh => tỉ lệ không đổi khi resize
const el = s => document.querySelector(s);
const topAt    = (s, k) => el(s).offsetTop - innerHeight*k;                          // 'top k%'
const bottomAt = (s, k) => el(s).offsetTop + el(s).offsetHeight - innerHeight*k;     // 'bottom k%'
// segment(y0, y1, len): đoạn cuộn y0→y1 (px) ánh xạ vào thời gian cục bộ 0→len
function segment(y0, y1, len){
  const a = Math.max(0, y0)/M, span = (Math.min(M, y1) - Math.max(0, y0))/M/len;
  const T = (vars) => ({ ...vars, duration:(vars.duration ?? .5)*span });
  return {
    to:     (target, vars, at) => master.to(target, T(vars), a + at*span),
    fromTo: (target, from, vars, at) => master.fromTo(target, from, T(vars), a + at*span),
  };
}

// INTRO -> HERO: dây đứt, 3 chai rơi vào bố cục quanh wordmark (1 trước, 1 sau chữ)
{ const sc = segment(0, el('#hero').offsetTop + el('#hero').offsetHeight/2 - innerHeight/2, 1.2);
  sc.to(S, { swing:0, duration:.2 }, 0);
  sc.to(S.word, { o:1, s:1, duration:.6, ease:'power2.out' }, .2);
  sc.to(S.tubes[0], { x:-3.2, y:.6, z:1.5,  rz:.5,  ry:2, s:1, duration:.8, ease:'power3.inOut' }, .2);
  sc.to(S.tubes[1], { x:-.4,  y:.2, z:-1.5, rz:.15, ry:3, duration:.8, ease:'power3.out' }, .3);   // SAU chữ
  sc.to(S.tubes[2], { x:2.6,  y:.9, z:2,    rz:-.35,ry:4, duration:.8, ease:'power3.out' }, .4);  // TRƯỚC chữ
}

// mỗi chapter: 1 chai hero xoay 360°, 2 chai kia bay ra; particle trôi parallax
CHAPTERS.forEach((c, i) => {
  const id = `#ch-${c.id}`;
  const heroX = c.side==='right' ? -2.6 : 2.4;
  const sc = segment(topAt(id, .6), bottomAt(id, 1), 1);
  sc.to(S.word, { o:0, duration:.1 }, 0);
  sc.to(S.field, { [i]:1, duration:.15 }, 0);
  sc.to(S.tubes[i], { x:heroX, y:0, z:2, rx:0, rz:-.25, s:HERO_SCALE, duration:.3, ease:'power2.out' }, 0);
  sc.to(S.tubes[i], { ry:`+=${Math.PI*2}`, duration:1 }, 0);
  sc.fromTo(`${id} .card`, { opacity:0 }, { opacity:1, duration:.2 }, .2);
  sc.to(S.field, { [i]:0, duration:.15 }, .85);
  tubes.forEach((_, j) => { if (j!==i) sc.to(S.tubes[j], { y: j<i ? 9 : -9, duration:.25, ease:'power2.in' }, 0); });

  // wipe + nền: không dùng chung state với ai => để ScrollTrigger riêng được
  gsap.timeline({ scrollTrigger:{ trigger:id, start:'top bottom', end:'top 25%', scrub:true,
      onToggle: self => { if (self.isActive) wipe.style.background = c.wipe; } } })
    .fromTo(wipe, { clipPath:'inset(100% 0 0 0)' }, { clipPath:'inset(0% 0 0 0)', duration:.5, ease:'none' })
    .to(wipe, { clipPath:'inset(0 0 100% 0)', duration:.5, ease:'none' });
  ScrollTrigger.create({ trigger:id, start:'top 50%', end:'bottom 50%',
    onToggle: self => { if (self.isActive) document.body.style.backgroundColor = c.bg; } });
});

// BAG: túi đi lên, 3 chai rơi vào túi, hóa đơn "in" ra
{ const sc = segment(topAt('#bag', .7), M, .9);
  sc.to(S.bag, { y:-.6, ry:-.35, duration:.3, ease:'power3.out' }, 0);
  BAG_DROP.forEach((d, j) => {
    sc.to(S.tubes[j], { x:d.x, y:5, z:0, rx:0, ry:0, rz:d.rz, s:d.s, duration:.15 }, .3 + j*.05);
    sc.to(S.tubes[j], { y:d.y, duration:.2, ease:'bounce.out' }, .45 + j*.05);
  });
  sc.to('#receipt', { y:'0%', duration:.3, ease:'steps(12)' }, .6);   // steps() = cảm giác máy in
  ScrollTrigger.create({ trigger:'#bag', start:'top 70%', end:'bottom bottom',
    onToggle: s => { if (s.isActive) document.body.style.backgroundColor = BAG_BG; } });
}
master.set({}, {}, 1);   // chốt tổng thời lượng = 1 để progress cuộn ánh xạ 1:1
ScrollTrigger.create({ start:0, end:'max', scrub, animation:master });
// intro + hero: trả nền về màu giấy (khi cuộn ngược hoặc nhảy thẳng lên đầu)
ScrollTrigger.create({ trigger:'#intro', start:'top top', endTrigger:'#hero', end:'bottom 50%',
  onToggle: s => { if (s.isActive) document.body.style.backgroundColor = ''; } });

/* ======================= 6. RENDER LOOP ======================= */
const dummy = new THREE.Object3D();
const mouse = { x:0, y:0 };
addEventListener('pointermove', e => { mouse.x = e.clientX/innerWidth-.5; mouse.y = e.clientY/innerHeight-.5; });

// LAYOUT: bố cục 3D được thiết kế cho màn ngang (nửa bề ngang nhìn thấy ≈ 7 đơn vị ở z=0).
// Màn dọc: lùi camera một chút, nén mọi toạ độ x theo L.xs, và hạ camera để vật thể nằm nửa trên
// (chữ DOM nằm nửa dưới, xem media query).
const L = { xs:1 };
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w, h, false); camera.aspect = a;
  camera.position.z = a < 1 ? 18 : 14;
  camera.position.y = a < 1 ? -1.8 : 0;
  const halfW = Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z * a;
  L.xs = Math.min(1, halfW / 7.06);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();

  // intro pendulum + dây
  const sway = Math.sin(t*1.3) * .12 * S.swing;
  tubes.forEach((m, i) => {
    const p = S.tubes[i];
    const idle = reduce ? 0 : Math.sin(t*.8 + i*2) * .08;      // bồng bềnh nhẹ
    m.position.set(p.x*L.xs + mouse.x*.3*(p.z*.3), p.y + idle, p.z);
    m.rotation.set(p.rx + mouse.y*.2, p.ry, p.rz + (i===0 ? sway : 0));
    m.scale.setScalar(p.s * Math.max(L.xs, .7));
  });
  // con lắc: tuýp 0 treo dưới điểm neo phía trên màn hình
  const LEN = 7, p0 = S.tubes[0];
  tubes[0].position.x += Math.sin(sway) * LEN;
  tubes[0].position.y += (1 - Math.cos(sway)) * LEN;
  string.visible = S.swing > .01;
  string.material.opacity = S.swing;
  const top = new THREE.Vector3(p0.x*L.xs, p0.y + H/2 + LEN, p0.z);
  const end = new THREE.Vector3(tubes[0].position.x, tubes[0].position.y + H/2, p0.z);
  string.position.copy(top).add(end).multiplyScalar(.5);
  string.scale.y = top.distanceTo(end) / 10;
  string.rotation.z = Math.atan2(end.x - top.x, top.y - end.y);

  wordmark.material.opacity = S.word.o;
  wordmark.scale.setScalar(S.word.s * L.xs);
  wordmark.visible = S.word.o > .01;

  fields.forEach((f, i) => {
    const k = S.field[i]; f.visible = k > .01;
    if (!f.visible) return;
    f.userData.seeds.forEach((s, j) => {
      const drift = reduce ? 0 : t*.15*s.sp;
      dummy.position.set(s.x*L.xs + mouse.x*s.z*.4, ((s.y + drift*3 + 4.5) % 9) - 4.5 - (1-k)*8, s.z);
      dummy.rotation.set(s.r + t*.3*s.sp, s.r*2 + t*.2, s.r);
      dummy.scale.setScalar(s.s * k);
      dummy.updateMatrix(); f.setMatrixAt(j, dummy.matrix);
    });
    f.instanceMatrix.needsUpdate = true;
  });

  bag.position.set(3.2*L.xs, S.bag.y, 0); bag.scale.setScalar(Math.max(L.xs, .6)); bag.rotation.y = S.bag.ry + Math.sin(t*.6)*.05;
  renderer.render(scene, camera);
});

/* ======================= 7. CHẾ ĐỘ SỬA NGAY TRÊN TRANG ======================= */
// Bấm "Sửa": chữ trên trang thành ô sửa trực tiếp; bảng bên phải đổi giá, tên thương hiệu,
// màu chai / nền / chuyển cảnh / hạt, ảnh từng tông. 3D cập nhật ngay.
// "Lưu" ghi vào trình duyệt này (localStorage). "Tải file HTML" xuất một index.html mới chứa nội dung đã sửa.
const ED = {
  setTube(i){ const m = tubes[i].userData.core.material; m.map.dispose(); m.map = oilTexture(CHAPTERS[i].tube); m.needsUpdate = true; },
  setParticle(i){ fields[i].material.color.set(CHAPTERS[i].pColor); },
  setWordmark(){
    const m = wordmark.material; m.map.dispose(); m.map = wordmarkTexture(BRAND.name, BRAND.wordmarkColor); m.needsUpdate = true;
    const w = bag.userData.wm.material; w.map.dispose(); w.map = wordmarkTexture(BRAND.name, BRAND.bagText); w.needsUpdate = true;
  },
  setBag(){ bag.userData.box.material.color.set(BRAND.bag); },
  // nền đang hiển thị: chương nào đang giữa màn hình thì lấy bg của chương đó
  refreshBg(){
    const mid = innerHeight/2;
    CHAPTERS.forEach(c => { const r = document.getElementById('ch-'+c.id).getBoundingClientRect();
      if (r.top < mid && r.bottom > mid) document.body.style.backgroundColor = c.bg; });
  },
};
let dirty = false;
const edBtn = document.createElement('button');
edBtn.id = 'ed-toggle'; edBtn.type = 'button'; edBtn.textContent = '✎ Sửa trang';
document.body.append(edBtn);

const panel = document.createElement('aside');
panel.id = 'ed-panel'; panel.setAttribute('aria-label', 'Chỉnh sửa trang');
const colorRow = (label, k) => `<label class="ed-row"><span>${label}</span><input type="color" data-ed="${k}" value="${getPath(k)}"></label>`;
const textRow  = (label, k) => `<label class="ed-row ed-col"><span>${label}</span><input type="text" data-ed="${k}" value="${esc(getPath(k))}"></label>`;
panel.innerHTML = `
  <header><b>Chỉnh sửa trang</b><button type="button" data-act="close" aria-label="Đóng">✕</button></header>
  <p class="ed-tip">Bấm trực tiếp vào chữ trên trang để sửa. Màu, giá và ảnh sửa ở đây.</p>
  <details open><summary>Thương hiệu & giá</summary>
    ${textRow('Chữ lớn 3D', 'brand.name')}
    ${textRow('Giá', 'brand.price')}
    ${textRow('Tài khoản (thẻ ảnh)', 'brand.handle')}
    ${colorRow('Màu chữ lớn', 'brand.wordmarkColor')}
    ${colorRow('Màu túi', 'brand.bag')}
    ${colorRow('Màu chữ trên túi', 'brand.bagText')}
  </details>
  ${CHAPTERS.map((c, i) => `
  <details><summary data-sum="${i}">${esc(c.title)}</summary>
    ${colorRow('Màu son (chai 3D)', `chapters.${i}.tube`)}
    ${colorRow('Màu nền', `chapters.${i}.bg`)}
    ${colorRow('Màu chuyển cảnh', `chapters.${i}.wipe`)}
    ${colorRow('Màu hạt bay', `chapters.${i}.pColor`)}
    <label class="ed-row ed-col"><span>Ảnh sản phẩm</span><input type="file" accept="image/*" data-img="${i}"></label>
    <button type="button" class="ed-link" data-go="${i}">Cuộn tới chương này ↓</button>
  </details>`).join('')}
  <footer>
    <p class="ed-status" aria-live="polite"></p>
    <button type="button" data-act="save" class="ed-primary">Lưu</button>
    <button type="button" data-act="export">Tải file HTML</button>
    <button type="button" data-act="reset" class="ed-danger">Khôi phục mặc định</button>
  </footer>`;
document.body.append(panel);
const status = panel.querySelector('.ed-status');
const say = (msg) => { status.textContent = msg; };
const markDirty = () => { dirty = true; say('Có thay đổi chưa lưu.'); };

function setEditing(on){
  document.body.classList.toggle('editing', on);
  edBtn.textContent = on ? '✓ Xong' : '✎ Sửa trang';
  document.querySelectorAll('[data-k]').forEach(el => {
    if (on) { try { el.contentEditable = 'plaintext-only'; } catch { el.contentEditable = 'true'; } el.spellcheck = false; }
    else el.removeAttribute('contenteditable');
  });
}
edBtn.addEventListener('click', () => setEditing(!document.body.classList.contains('editing')));

// sửa chữ trực tiếp
document.addEventListener('input', e => {
  const el = e.target.closest?.('[data-k][contenteditable]'); if (!el) return;
  const v = el.hasAttribute('data-multi') ? el.innerText.replace(/\n+$/, '') : el.textContent;
  setPath(el.dataset.k, v);
  // cùng một khoá có thể hiện ở nhiều chỗ (vd. nút "Thêm vào giỏ" ở cả 3 chương)
  document.querySelectorAll(`[data-k="${el.dataset.k}"]`).forEach(o => { if (o !== el) o.textContent = v; });
  if (/^chapters\.\d+\.title$/.test(el.dataset.k)) {
    const i = +el.dataset.k.split('.')[1]; panel.querySelector(`[data-sum="${i}"]`).textContent = v;
  }
  fillDerived(); markDirty();
});
// Enter = xuống dòng chỉ ở tiêu đề nhiều dòng; chỗ khác thì thoát ô
document.addEventListener('keydown', e => {
  const el = e.target.closest?.('[data-k][contenteditable]');
  if (el && e.key === 'Enter' && !el.hasAttribute('data-multi')) { e.preventDefault(); el.blur(); }
});
// không cho nút CTA / liên kết hoạt động khi đang sửa
document.addEventListener('click', e => { if (document.body.classList.contains('editing') && e.target.closest('.cta')) e.preventDefault(); }, true);

// bảng màu & ô nhập
panel.addEventListener('input', e => {
  const k = e.target.dataset.ed; if (!k) return;
  setPath(k, e.target.value);
  const m = k.match(/^chapters\.(\d+)\.(\w+)$/);
  if (m) {
    const i = +m[1];
    if (m[2] === 'tube') ED.setTube(i);
    if (m[2] === 'pColor') ED.setParticle(i);
    if (m[2] === 'bg') ED.refreshBg();
    if (m[2] === 'wipe') { wipe.style.background = e.target.value; }
  } else {
    if (k === 'brand.name' || k === 'brand.wordmarkColor' || k === 'brand.bagText') ED.setWordmark();
    if (k === 'brand.bag') ED.setBag();
  }
  fillDerived(); markDirty();
});
// đổi ảnh: đọc thành data URL để còn lưu / xuất được
panel.addEventListener('change', e => {
  const i = e.target.dataset.img; if (i === undefined) return;
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { CHAPTERS[i].img = r.result; fillDerived(); markDirty(); };
  r.readAsDataURL(f);
});
panel.addEventListener('click', e => {
  const go = e.target.dataset.go;
  if (go !== undefined) {
    const el = document.getElementById('ch-' + CHAPTERS[go].id);
    scrollTo({ top: el.offsetTop + innerHeight * .9, behavior: 'smooth' });
  }
  const act = e.target.dataset.act;
  if (act === 'close') setEditing(false);
  if (act === 'save') {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(CONTENT)); dirty = false; say('Đã lưu trong trình duyệt này.'); }
    catch { say('Không lưu được (có thể do ảnh quá lớn). Hãy dùng "Tải file HTML".'); }
  }
  if (act === 'export') {
    const json = JSON.stringify(CONTENT, null, 1).replace(/<\//g, '<\\/');
    const html = PAGE_SOURCE.replace(/(<script id="content" type="application\/json">)[\s\S]*?(<\/script>)/, `$1\n${json}\n$2`);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type:'text/html' }));
    a.download = 'index.html'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    say('Đã tải file. Đặt cạnh thư mục img/ để ảnh mặc định hiển thị.');
  }
  if (act === 'reset' && confirm('Xoá mọi chỉnh sửa và quay về nội dung gốc?')) {
    try { localStorage.removeItem(STORE_KEY); } catch {}
    dirty = false; location.reload();
  }
});
addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
</script>
