<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova — Lip Tint</title>
<!--
  TEMPLATE: 3D scroll-driven product site.
  Sửa BRAND + CHAPTERS bên dưới là đủ để ra một site mới.
  Kiến trúc: 1 canvas Three.js cố định + các <section> DOM cao nhiều vh làm "đường ray" cuộn.
  GSAP ScrollTrigger scrub một timeline duy nhất -> ghi vào object `S` (state);
  vòng render đọc `S` mỗi frame. Không có logic nào nằm trong scroll handler.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1512; --paper:#f4efe9; --muted:#8a7f78;
    --accent:#5a2e1f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  body{overflow-x:clip} /* KHÔNG dùng overflow-x:hidden trên html/body: nó làm hỏng position:sticky */
  body{transition:background-color .2s linear}
  canvas#gl{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}

  /* --- chrome --- */
  nav{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
      padding:18px 24px;font-size:12px;letter-spacing:.02em}
  nav .logo{font-weight:800;font-size:15px}
  nav ul{display:flex;gap:20px;list-style:none;text-transform:uppercase;color:var(--muted)}
  nav .bag{width:28px;height:28px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px}

  /* --- scroll rails --- */
  section{position:relative;z-index:2;pointer-events:none}
  section .pin{position:sticky;top:0;height:100vh;padding:80px 24px 32px;display:flex;flex-direction:column;justify-content:center}
  #intro{height:180vh} #hero{height:220vh} .chapter{height:260vh} #bag{height:260vh}

  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .tagline{position:absolute;top:90px;left:24px;max-width:220px;font-weight:500;font-size:clamp(14px,1.4vw,18px);line-height:1.15}
  .hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* chapter copy */
  .copy{max-width:420px;pointer-events:auto}
  .copy h2{font-weight:900;font-size:clamp(56px,11vw,160px);letter-spacing:-.05em;line-height:.85;margin:8px 0 14px}
  .copy p{font-size:14px;line-height:1.4;max-width:280px;color:var(--muted)}
  .chips{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}
  .chips span{font-size:11px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.7)}
  .cta{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:99px;
       padding:10px 10px 10px 18px;font:500 13px Inter,sans-serif;cursor:pointer}
  .cta b{background:#fff;color:var(--ink);border-radius:99px;padding:3px 8px;font-size:11px}
  .chapter.right .pin{align-items:flex-end;text-align:right}
  .chapter.right .chips{justify-content:flex-end}

  /* social-proof card (nội dung mẫu — thay bằng nội dung thật của khách) */
  .card{position:absolute;right:8vw;top:50%;width:min(260px,60vw);transform:translateY(-50%) rotate(2deg);transition:none;
        background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-radius:14px;padding:10px;font-size:11px;
        box-shadow:0 30px 60px -20px rgba(0,0,0,.35);opacity:0}
  .chapter.right .card{right:auto;left:8vw;transform:translateY(-50%) rotate(-2deg)}
  .card .ph{aspect-ratio:4/5;border-radius:8px;margin:8px 0;background:linear-gradient(160deg,#fff,var(--c))}
  .card .u{display:flex;gap:6px;align-items:center;font-weight:500}
  .card .u i{width:18px;height:18px;border-radius:50%;background:var(--c)}

  /* full-screen color wipe between chapters */
  #wipe{position:fixed;inset:0;z-index:5;pointer-events:none;clip-path:inset(100% 0 0 0)}

  /* bag scene */
  #bag .copy h2{font-size:clamp(44px,7vw,96px)}
  .receipt{position:absolute;left:24px;top:56px;width:150px;background:#fff;color:#222;font:11px/1.5 ui-monospace,monospace;
           padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);transform:translateY(-140%);
           clip-path:polygon(0 0,100% 0,100% 100%,90% 97%,80% 100%,70% 97%,60% 100%,50% 97%,40% 100%,30% 97%,20% 100%,10% 97%,0 100%)}
  .receipt .big{font-size:26px;font-weight:800;text-align:center}
  .receipt .bar{height:28px;margin:8px 0;background:repeating-linear-gradient(90deg,#222 0 2px,#fff 2px 4px,#222 4px 5px,#fff 5px 8px)}

  @media (max-width:640px){ nav ul{display:none} .card{display:none}
    .chapter .pin,#bag .pin{justify-content:flex-end;padding-bottom:72px} .chapter.right .pin{align-items:flex-start;text-align:left}
    .chapter.right .chips{justify-content:flex-start} #bag .copy{margin-left:0!important} .receipt{left:16px;width:120px} }
  @media (prefers-reduced-motion:reduce){ #wipe{display:none} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="wipe"></div>

<nav>
  <div class="logo" data-brand></div>
  <ul data-nav></ul>
  <div class="bag">0</div>
</nav>

<section id="intro"><div class="pin"><div class="hint">Scroll</div></div></section>
<section id="hero"><div class="pin"><p class="tagline" data-tagline></p></div></section>
<div id="chapters"></div>
<section id="bag"><div class="pin">
  <div class="receipt" id="receipt"><div class="big">−15%</div><div class="bar"></div>
    <div>TOTAL ........ €62.00</div><div>BUNDLE ...... −€9.30</div></div>
  <div class="copy" style="margin-left:14vw">
    <div class="eyebrow">The trio</div>
    <h2>It's in<br>the bag.</h2>
    <p>All three shades, one bag, one price.</p><br>
    <button class="cta">Shop the trio <b>−15%</b></button>
  </div>
</div></section>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script type="module">
import * as THREE from 'three';

/* ======================= 1. CONTENT — sửa ở đây ======================= */
const BRAND = { name:'nova', tagline:'Lip tint that melts like the things you crave.', wordmarkColor:'#3b1d14' };
const CHAPTERS = [
  { id:'cacao',  title:'Cacao',     eyebrow:'01 — Chocolate', text:'A cocoa-brown veil with a blurred, velvet finish.',
    chips:['Cocoa butter','Vitamin E','8h wear'], bg:'#efe4da', tube:'#6b3a26', wipe:'#3b1d14', particle:'shard',     pColor:'#5a2e1f', side:'left'  },
  { id:'peche',  title:'Pêche',     eyebrow:'02 — Peach',     text:'Sun-warm peach that glows on every skin tone.',
    chips:['Peach extract','Glossy','Buildable'],  bg:'#f7e3d6', tube:'#e8a07c', wipe:'#f2b38f', particle:'sphere',    pColor:'#f39a6b', side:'right' },
  { id:'framb',  title:'Framboise', eyebrow:'03 — Raspberry', text:'Bitten-berry red that lasts through every coffee.',
    chips:['Raspberry seed oil','Matte','Transfer-proof'], bg:'#f6d9df', tube:'#c8203a', wipe:'#e8345a', particle:'berry', pColor:'#d0294a', side:'left' },
];

/* ======================= 2. DOM build ======================= */
document.title = `${BRAND.name} — Lip Tint`;
document.querySelector('[data-brand]').textContent = BRAND.name;
document.querySelector('[data-tagline]').textContent = BRAND.tagline;
document.querySelector('[data-nav]').innerHTML = CHAPTERS.map(c=>`<li>${c.title}</li>`).join('');
document.getElementById('chapters').innerHTML = CHAPTERS.map(c=>`
  <section class="chapter ${c.side==='right'?'right':''}" id="ch-${c.id}"><div class="pin">
    <div class="copy">
      <div class="eyebrow">${c.eyebrow}</div><h2>${c.title}</h2><p>${c.text}</p>
      <div class="chips">${c.chips.map(x=>`<span>${x}</span>`).join('')}</div>
      <button class="cta">Add to bag <b>€24</b></button>
    </div>
    <div class="card" style="--c:${c.tube}">
      <div class="u"><i></i>${BRAND.name}.official</div><div class="ph"></div>
      <div>♥ 1,204 · sample post — replace with real content</div>
    </div>
  </div></section>`).join('');

/* ======================= 3. THREE scene ======================= */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 14);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8c8bc, 1.6));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(4, 6, 8); scene.add(key);
const rim = new THREE.DirectionalLight(0xffe8dc, 1.2); rim.position.set(-6, 2, -4); scene.add(rim);

// --- label texture (brand text dọc thân tuýp)
function labelTexture(color){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = color; g.fillRect(0,0,512,256);
  g.fillStyle = 'rgba(255,255,255,.92)'; g.font = '800 92px Inter, sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillText(BRAND.name, 256, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// --- procedural product: tuýp son (thay bằng GLTFLoader nếu có model thật)
function makeTube(color){
  const g = new THREE.Group();
  const tex = labelTexture(color);
  tex.rotation = Math.PI/2; tex.center.set(.5,.5);
  const body = new THREE.Mesh(new THREE.CylinderGeometry(.34,.30,2.3,64,1,false),
    new THREE.MeshPhysicalMaterial({ map:tex, roughness:.35, clearcoat:1, clearcoatRoughness:.15 }));
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.9,64),
    new THREE.MeshPhysicalMaterial({ color:new THREE.Color(color).multiplyScalar(.55), roughness:.25, clearcoat:1 }));
  cap.position.y = 1.6;
  const crimp = new THREE.Mesh(new THREE.BoxGeometry(.72,.12,.08), body.material);
  crimp.position.y = -1.2;
  g.add(body, cap, crimp);
  return g;
}
// --- wordmark khổng lồ làm plane trong scene => vật thể có thể nằm TRƯỚC và SAU chữ
function makeWordmark(text, color){
  const c = document.createElement('canvas'); c.width = 2048; c.height = 640;
  const g = c.getContext('2d'); g.fillStyle = color;
  g.font = '900 560px Inter, sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  g.fillText(text, 1024, 340);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(12, 3.75),
    new THREE.MeshBasicMaterial({ map:t, transparent:true, depthWrite:false }));
  return m;
}
// --- particle field theo chương (InstancedMesh: 1 draw call)
function makeParticles(kind, color, n=26){
  const geo = kind==='shard'  ? new THREE.TetrahedronGeometry(.32).scale(1.4,.5,1)
            : kind==='sphere' ? new THREE.SphereGeometry(.5, 32, 32)
            :                   new THREE.IcosahedronGeometry(.42, 1);
  const mat = new THREE.MeshPhysicalMaterial({ color, roughness: kind==='sphere'?.6:.4, clearcoat:.4, flatShading: kind==='berry' });
  const mesh = new THREE.InstancedMesh(geo, mat, n);
  mesh.userData.seeds = Array.from({length:n}, (_,i)=>({
    x:(Math.random()-.5)*14, y:(Math.random()-.5)*9, z:-4+Math.random()*7,
    r:Math.random()*Math.PI*2, s:.5+Math.random()*1.1, sp:.3+Math.random()*.9
  }));
  mesh.visible = false;
  return mesh;
}
// --- shopping bag
function makeBag(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x3b1d14, roughness:.85 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(3,3.4,1.2), mat);
  const h = new THREE.Mesh(new THREE.TorusGeometry(.7,.04,12,48,Math.PI), new THREE.MeshStandardMaterial({ color:0xd9c3a5 }));
  h.position.y = 1.7;
  const wm = makeWordmark(BRAND.name, '#f4e6d2'); wm.scale.setScalar(.22); wm.position.set(0,-.3,.61);
  g.add(box, h, wm);
  return g;
}

const wordmark = makeWordmark(BRAND.name, BRAND.wordmarkColor); scene.add(wordmark);
const tubes = CHAPTERS.map(c => { const t = makeTube(c.tube); scene.add(t); return t; });
const fields = CHAPTERS.map(c => { const f = makeParticles(c.particle, c.pColor); scene.add(f); return f; });
const bag = makeBag(); scene.add(bag);
const string = new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,10), new THREE.MeshBasicMaterial({ color:0xb9aea6, transparent:true }));
scene.add(string);

/* ======================= 4. STATE — timeline ghi vào đây ======================= */
// Mỗi tuýp: x,y,z,rx,ry,rz,s. Toàn cục: wordmark opacity/scale, chương đang active, bag.
const S = {
  tubes: tubes.map(()=>({ x:0, y:12, z:0, rx:0, ry:0, rz:0, s:1 })),
  word:{ o:0, s:.85, y:0 }, field:CHAPTERS.map(()=>0), bag:{ y:-12, ry:0 }, swing:1, cam:{ z:14 }
};
// intro: tuýp 0 treo bằng dây ở giữa
Object.assign(S.tubes[0], { y:.4, s:.9 });

/* ======================= 5. SCROLL CHOREOGRAPHY ======================= */
gsap.registerPlugin(ScrollTrigger);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const scrub = reduce ? true : 1;   // 1s làm mượt scrub — đây là "cảm giác" cao cấp
const wipe = document.getElementById('wipe');
const HERO_SCALE = 1.35;                       // cỡ chai hero trong mỗi chương
const BAG_DROP = [ {x:2.7, y:.9, rz:.2, s:.9}, {x:3.2, y:1.1, rz:-.1, s:.9}, {x:3.7, y:.8, rz:-.3, s:.9} ];                          // vị trí 3 chai khi nằm trong túi
const BAG_BG = '#eef0ec';

// MỘT master timeline cho mọi thứ dùng chung state S.
// Nếu nhiều timeline cùng tween một thuộc tính, .to() ghi nhận giá trị bắt đầu ở lần render đầu,
// nên khi nhảy thẳng vào giữa trang (reload, bấm menu, "cuộn tới chương") vật thể bị kẹt sai chỗ.
// Một timeline duy nhất được GSAP render tuần tự => vị trí luôn đúng dù nhảy tới đâu.
const master = gsap.timeline({ defaults:{ ease:'none' } });
const M = document.documentElement.scrollHeight - innerHeight;   // các section cao theo vh => tỉ lệ không đổi khi resize
const el = s => document.querySelector(s);
const topAt    = (s, k) => el(s).offsetTop - innerHeight*k;                          // 'top k%'
const bottomAt = (s, k) => el(s).offsetTop + el(s).offsetHeight - innerHeight*k;     // 'bottom k%'
// segment(y0, y1, len): đoạn cuộn y0→y1 (px) ánh xạ vào thời gian cục bộ 0→len
function segment(y0, y1, len){
  const a = Math.max(0, y0)/M, span = (Math.min(M, y1) - Math.max(0, y0))/M/len;
  const T = (vars) => ({ ...vars, duration:(vars.duration ?? .5)*span });
  return {
    to:     (target, vars, at) => master.to(target, T(vars), a + at*span),
    fromTo: (target, from, vars, at) => master.fromTo(target, from, T(vars), a + at*span),
  };
}

// INTRO -> HERO: dây đứt, 3 chai rơi vào bố cục quanh wordmark (1 trước, 1 sau chữ)
{ const sc = segment(0, el('#hero').offsetTop + el('#hero').offsetHeight/2 - innerHeight/2, 1.2);
  sc.to(S, { swing:0, duration:.2 }, 0);
  sc.to(S.word, { o:1, s:1, duration:.6, ease:'power2.out' }, .2);
  sc.to(S.tubes[0], { x:-3.2, y:.6, z:1.5,  rz:.5,  ry:2, s:1, duration:.8, ease:'power3.inOut' }, .2);
  sc.to(S.tubes[1], { x:-.4,  y:.2, z:-1.5, rz:.15, ry:3, duration:.8, ease:'power3.out' }, .3);   // SAU chữ
  sc.to(S.tubes[2], { x:2.6,  y:.9, z:2,    rz:-.35,ry:4, duration:.8, ease:'power3.out' }, .4);  // TRƯỚC chữ
}

// mỗi chapter: 1 chai hero xoay 360°, 2 chai kia bay ra; particle trôi parallax
CHAPTERS.forEach((c, i) => {
  const id = `#ch-${c.id}`;
  const heroX = c.side==='right' ? -2.6 : 2.4;
  const sc = segment(topAt(id, .6), bottomAt(id, 1), 1);
  sc.to(S.word, { o:0, duration:.1 }, 0);
  sc.to(S.field, { [i]:1, duration:.15 }, 0);
  sc.to(S.tubes[i], { x:heroX, y:0, z:2, rx:0, rz:-.25, s:HERO_SCALE, duration:.3, ease:'power2.out' }, 0);
  sc.to(S.tubes[i], { ry:`+=${Math.PI*2}`, duration:1 }, 0);
  sc.fromTo(`${id} .card`, { opacity:0 }, { opacity:1, duration:.2 }, .2);
  sc.to(S.field, { [i]:0, duration:.15 }, .85);
  tubes.forEach((_, j) => { if (j!==i) sc.to(S.tubes[j], { y: j<i ? 9 : -9, duration:.25, ease:'power2.in' }, 0); });

  // wipe + nền: không dùng chung state với ai => để ScrollTrigger riêng được
  gsap.timeline({ scrollTrigger:{ trigger:id, start:'top bottom', end:'top 25%', scrub:true,
      onToggle: self => { if (self.isActive) wipe.style.background = c.wipe; } } })
    .fromTo(wipe, { clipPath:'inset(100% 0 0 0)' }, { clipPath:'inset(0% 0 0 0)', duration:.5, ease:'none' })
    .to(wipe, { clipPath:'inset(0 0 100% 0)', duration:.5, ease:'none' });
  ScrollTrigger.create({ trigger:id, start:'top 50%', end:'bottom 50%',
    onToggle: self => { if (self.isActive) document.body.style.backgroundColor = c.bg; } });
});

// BAG: túi đi lên, 3 chai rơi vào túi, hóa đơn "in" ra
{ const sc = segment(topAt('#bag', .7), M, .9);
  sc.to(S.bag, { y:-.6, ry:-.35, duration:.3, ease:'power3.out' }, 0);
  BAG_DROP.forEach((d, j) => {
    sc.to(S.tubes[j], { x:d.x, y:5, z:0, rx:0, ry:0, rz:d.rz, s:d.s, duration:.15 }, .3 + j*.05);
    sc.to(S.tubes[j], { y:d.y, duration:.2, ease:'bounce.out' }, .45 + j*.05);
  });
  sc.to('#receipt', { y:'0%', duration:.3, ease:'steps(12)' }, .6);   // steps() = cảm giác máy in
  ScrollTrigger.create({ trigger:'#bag', start:'top 70%', end:'bottom bottom',
    onToggle: s => { if (s.isActive) document.body.style.backgroundColor = BAG_BG; } });
}
master.set({}, {}, 1);   // chốt tổng thời lượng = 1 để progress cuộn ánh xạ 1:1
ScrollTrigger.create({ start:0, end:'max', scrub, animation:master });
// intro + hero: trả nền về màu giấy (khi cuộn ngược hoặc nhảy thẳng lên đầu)
ScrollTrigger.create({ trigger:'#intro', start:'top top', endTrigger:'#hero', end:'bottom 50%',
  onToggle: s => { if (s.isActive) document.body.style.backgroundColor = ''; } });

/* ======================= 6. RENDER LOOP ======================= */
const dummy = new THREE.Object3D();
const mouse = { x:0, y:0 };
addEventListener('pointermove', e => { mouse.x = e.clientX/innerWidth-.5; mouse.y = e.clientY/innerHeight-.5; });

// LAYOUT: bố cục 3D được thiết kế cho màn ngang (nửa bề ngang nhìn thấy ≈ 7 đơn vị ở z=0).
// Màn dọc: lùi camera một chút, nén mọi toạ độ x theo L.xs, và hạ camera để vật thể nằm nửa trên
// (chữ DOM nằm nửa dưới, xem media query).
const L = { xs:1 };
function resize(){
  const w = innerWidth, h = innerHeight, a = w/h;
  renderer.setSize(w, h, false); camera.aspect = a;
  camera.position.z = a < 1 ? 18 : 14;
  camera.position.y = a < 1 ? -1.8 : 0;
  const halfW = Math.tan(THREE.MathUtils.degToRad(camera.fov/2)) * camera.position.z * a;
  L.xs = Math.min(1, halfW / 7.06);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();

  // intro pendulum + dây
  const sway = Math.sin(t*1.3) * .12 * S.swing;
  tubes.forEach((m, i) => {
    const p = S.tubes[i];
    const idle = reduce ? 0 : Math.sin(t*.8 + i*2) * .08;      // bồng bềnh nhẹ
    m.position.set(p.x*L.xs + mouse.x*.3*(p.z*.3), p.y + idle, p.z);
    m.rotation.set(p.rx + mouse.y*.2, p.ry, p.rz + (i===0 ? sway : 0));
    m.scale.setScalar(p.s * Math.max(L.xs, .7));
  });
  // con lắc: tuýp 0 treo dưới điểm neo phía trên màn hình
  const LEN = 7, p0 = S.tubes[0];
  tubes[0].position.x += Math.sin(sway) * LEN;
  tubes[0].position.y += (1 - Math.cos(sway)) * LEN;
  string.visible = S.swing > .01;
  string.material.opacity = S.swing;
  const top = new THREE.Vector3(p0.x*L.xs, p0.y + 1.9 + LEN, p0.z);
  const end = new THREE.Vector3(tubes[0].position.x, tubes[0].position.y + 1.9, p0.z);
  string.position.copy(top).add(end).multiplyScalar(.5);
  string.scale.y = top.distanceTo(end) / 10;
  string.rotation.z = Math.atan2(end.x - top.x, top.y - end.y);

  wordmark.material.opacity = S.word.o;
  wordmark.scale.setScalar(S.word.s * L.xs);
  wordmark.visible = S.word.o > .01;

  fields.forEach((f, i) => {
    const k = S.field[i]; f.visible = k > .01;
    if (!f.visible) return;
    f.userData.seeds.forEach((s, j) => {
      const drift = reduce ? 0 : t*.15*s.sp;
      dummy.position.set(s.x*L.xs + mouse.x*s.z*.4, ((s.y + drift*3 + 4.5) % 9) - 4.5 - (1-k)*8, s.z);
      dummy.rotation.set(s.r + t*.3*s.sp, s.r*2 + t*.2, s.r);
      dummy.scale.setScalar(s.s * k);
      dummy.updateMatrix(); f.setMatrixAt(j, dummy.matrix);
    });
    f.instanceMatrix.needsUpdate = true;
  });

  bag.position.set(3.2*L.xs, S.bag.y, 0); bag.scale.setScalar(Math.max(L.xs, .6)); bag.rotation.y = S.bag.ry + Math.sin(t*.6)*.05;
  renderer.render(scene, camera);
});
</script>
